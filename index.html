<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SimuYaNyumbani — Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<style>
:root {
  --bg: #080c14;
  --surface: #0d1420;
  --surface2: #121a2a;
  --border: rgba(255,255,255,0.06);
  --accent: #00d4ff;
  --accent2: #ff6b35;
  --accent3: #4ade80;
  --accent4: #f59e0b;
  --text: #e2e8f0;
  --muted: #4a5568;
  --danger: #ff4d6d;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Syne', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* Background */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: 
    radial-gradient(ellipse 60% 40% at 10% 10%, rgba(0,212,255,0.05) 0%, transparent 60%),
    radial-gradient(ellipse 50% 30% at 90% 90%, rgba(255,107,53,0.04) 0%, transparent 60%);
  pointer-events: none;
  z-index: 0;
}

/* Header */
header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(8,12,20,0.95);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 14px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
}

.logo-icon {
  width: 36px;
  height: 36px;
  background: linear-gradient(135deg, var(--accent), #0066ff);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  box-shadow: 0 0 20px rgba(0,212,255,0.3);
}

.logo-text {
  font-size: 16px;
  font-weight: 800;
  letter-spacing: -0.5px;
}

.logo-sub {
  font-size: 10px;
  color: var(--muted);
  font-family: 'JetBrains Mono', monospace;
  letter-spacing: 2px;
}

.status-badge {
  display: flex;
  align-items: center;
  gap: 6px;
  background: rgba(74,222,128,0.08);
  border: 1px solid rgba(74,222,128,0.2);
  border-radius: 20px;
  padding: 5px 12px;
  font-size: 11px;
  font-weight: 700;
  color: var(--accent3);
  font-family: 'JetBrains Mono', monospace;
}

.status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--accent3);
  box-shadow: 0 0 8px var(--accent3);
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}

/* Stats */
.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  padding: 16px;
  position: relative;
  z-index: 1;
}

@media (max-width: 600px) {
  .stats { grid-template-columns: repeat(2, 1fr); }
}

.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 14px;
  position: relative;
  overflow: hidden;
}

.stat-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
}

.stat-card.calls::before { background: linear-gradient(90deg, var(--accent), transparent); }
.stat-card.sms-in::before { background: linear-gradient(90deg, var(--accent3), transparent); }
.stat-card.sms-out::before { background: linear-gradient(90deg, var(--accent2), transparent); }
.stat-card.contacts::before { background: linear-gradient(90deg, var(--accent4), transparent); }

.stat-num {
  font-size: 28px;
  font-weight: 800;
  line-height: 1;
  margin-bottom: 4px;
}

.stat-card.calls .stat-num { color: var(--accent); }
.stat-card.sms-in .stat-num { color: var(--accent3); }
.stat-card.sms-out .stat-num { color: var(--accent2); }
.stat-card.contacts .stat-num { color: var(--accent4); }

.stat-label {
  font-size: 10px;
  color: var(--muted);
  font-family: 'JetBrains Mono', monospace;
  letter-spacing: 1px;
}

/* Tabs */
.tabs {
  display: flex;
  padding: 0 16px;
  gap: 4px;
  border-bottom: 1px solid var(--border);
  position: relative;
  z-index: 1;
  overflow-x: auto;
}

.tab {
  padding: 12px 16px;
  border: none;
  background: transparent;
  color: var(--muted);
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 1px;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all 0.2s;
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 6px;
}

.tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.tab:hover:not(.active) { color: var(--text); }

.tab-badge {
  background: var(--accent);
  color: var(--bg);
  border-radius: 10px;
  padding: 1px 6px;
  font-size: 9px;
  font-weight: 800;
}

.tab.sms-in-tab.active { color: var(--accent3); border-bottom-color: var(--accent3); }
.tab.sms-in-tab .tab-badge { background: var(--accent3); }

.tab.sms-out-tab.active { color: var(--accent2); border-bottom-color: var(--accent2); }
.tab.sms-out-tab .tab-badge { background: var(--accent2); }

.tab.contacts-tab.active { color: var(--accent4); border-bottom-color: var(--accent4); }
.tab.contacts-tab .tab-badge { background: var(--accent4); }

/* Content */
.content {
  padding: 16px;
  position: relative;
  z-index: 1;
}

.panel { display: none; }
.panel.active { display: block; }

/* Search */
.search-box {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 14px;
  margin-bottom: 14px;
}

.search-box input {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  color: var(--text);
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
}

.search-box input::placeholder { color: var(--muted); }

/* Items */
.item {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 8px;
  display: flex;
  align-items: flex-start;
  gap: 12px;
  transition: border-color 0.2s;
  cursor: pointer;
}

.item:hover { border-color: rgba(255,255,255,0.12); }

.item-avatar {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  font-weight: 800;
  flex-shrink: 0;
}

.item-body { flex: 1; min-width: 0; }

.item-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 4px;
}

.item-name {
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.item-time {
  font-size: 10px;
  color: var(--muted);
  font-family: 'JetBrains Mono', monospace;
  flex-shrink: 0;
  margin-left: 8px;
}

.item-number {
  font-size: 11px;
  color: var(--muted);
  font-family: 'JetBrains Mono', monospace;
  margin-bottom: 4px;
}

.item-preview {
  font-size: 12px;
  color: #94a3b8;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  border-radius: 6px;
  padding: 2px 8px;
  font-size: 10px;
  font-weight: 700;
  font-family: 'JetBrains Mono', monospace;
  margin-top: 6px;
}

.badge.in { background: rgba(74,222,128,0.1); color: var(--accent3); border: 1px solid rgba(74,222,128,0.2); }
.badge.out { background: rgba(255,107,53,0.1); color: var(--accent2); border: 1px solid rgba(255,107,53,0.2); }
.badge.missed { background: rgba(255,77,109,0.1); color: var(--danger); border: 1px solid rgba(255,77,109,0.2); }
.badge.duration { background: rgba(0,212,255,0.1); color: var(--accent); border: 1px solid rgba(0,212,255,0.2); margin-left: 4px; }

/* Empty state */
.empty {
  text-align: center;
  padding: 50px 20px;
  color: var(--muted);
}

.empty-icon { font-size: 40px; margin-bottom: 12px; }
.empty-text { font-size: 13px; }

/* Loading */
.loading {
  text-align: center;
  padding: 40px;
  color: var(--muted);
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
}

.spinner {
  width: 30px;
  height: 30px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin: 0 auto 12px;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* Contacts grid */
.contacts-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
}

@media (min-width: 600px) {
  .contacts-grid { grid-template-columns: repeat(3, 1fr); }
}

.contact-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px;
  text-align: center;
}

.contact-avatar {
  width: 44px;
  height: 44px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  font-weight: 800;
  margin: 0 auto 8px;
}

.contact-name {
  font-size: 12px;
  font-weight: 700;
  color: var(--text);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  margin-bottom: 3px;
}

.contact-number {
  font-size: 10px;
  color: var(--muted);
  font-family: 'JetBrains Mono', monospace;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* Refresh button */
.refresh-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  background: rgba(0,212,255,0.08);
  border: 1px solid rgba(0,212,255,0.2);
  border-radius: 8px;
  padding: 8px 14px;
  color: var(--accent);
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  margin-bottom: 14px;
  transition: all 0.2s;
}

.refresh-btn:hover { background: rgba(0,212,255,0.12); }

/* Modal */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.8);
  z-index: 1000;
  display: none;
  align-items: flex-end;
  justify-content: center;
}

.modal-overlay.open { display: flex; }

.modal {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 20px 20px 0 0;
  padding: 20px;
  width: 100%;
  max-width: 500px;
  max-height: 80vh;
  overflow-y: auto;
}

.modal-handle {
  width: 40px;
  height: 4px;
  background: var(--border);
  border-radius: 2px;
  margin: 0 auto 16px;
}

.modal-title {
  font-size: 16px;
  font-weight: 800;
  margin-bottom: 16px;
  color: var(--accent);
}

.modal-row {
  display: flex;
  justify-content: space-between;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
}

.modal-row:last-child { border-bottom: none; }
.modal-key { color: var(--muted); font-family: 'JetBrains Mono', monospace; font-size: 11px; }
.modal-val { color: var(--text); font-weight: 600; text-align: right; max-width: 60%; word-break: break-all; }

.modal-close {
  width: 100%;
  margin-top: 16px;
  padding: 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  font-family: 'Syne', sans-serif;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
}

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">📱</div>
    <div>
      <div class="logo-text">SimuYaNyumbani</div>
      <div class="logo-sub">DASHBOARD</div>
    </div>
  </div>
  <div class="status-badge">
    <div class="status-dot"></div>
    LIVE
  </div>
</header>

<!-- Stats -->
<div class="stats">
  <div class="stat-card calls">
    <div class="stat-num" id="count-calls">—</div>
    <div class="stat-label">SIMU ZOTE</div>
  </div>
  <div class="stat-card sms-in">
    <div class="stat-num" id="count-sms-in">—</div>
    <div class="stat-label">SMS ZILIZOINGIA</div>
  </div>
  <div class="stat-card sms-out">
    <div class="stat-num" id="count-sms-out">—</div>
    <div class="stat-label">SMS ZILIZOTOKA</div>
  </div>
  <div class="stat-card contacts">
    <div class="stat-num" id="count-contacts">—</div>
    <div class="stat-label">CONTACTS</div>
  </div>
</div>

<!-- Tabs -->
<div class="tabs">
  <button class="tab active" onclick="showTab('calls-panel', this)">
    📞 SIMU <span class="tab-badge" id="tab-calls">0</span>
  </button>
  <button class="tab sms-in-tab" onclick="showTab('sms-in-panel', this)">
    📩 SMS ILIYOINGIA <span class="tab-badge" id="tab-sms-in">0</span>
  </button>
  <button class="tab sms-out-tab" onclick="showTab('sms-out-panel', this)">
    📤 SMS ILIYOTOKA <span class="tab-badge" id="tab-sms-out">0</span>
  </button>
  <button class="tab contacts-tab" onclick="showTab('contacts-panel', this)">
    👥 CONTACTS <span class="tab-badge" id="tab-contacts">0</span>
  </button>
</div>

<!-- Content -->
<div class="content">

  <!-- CALLS -->
  <div id="calls-panel" class="panel active">
    <button class="refresh-btn" onclick="loadCalls()">
      🔄 REFRESH
    </button>
    <div class="search-box">
      <span style="color:var(--muted)">🔍</span>
      <input type="text" placeholder="Tafuta namba au jina..." oninput="filterCalls(this.value)">
    </div>
    <div id="calls-list"><div class="loading"><div class="spinner"></div>Inapakia...</div></div>
  </div>

  <!-- SMS IN -->
  <div id="sms-in-panel" class="panel">
    <button class="refresh-btn" onclick="loadSmsIn()">
      🔄 REFRESH
    </button>
    <div class="search-box">
      <span style="color:var(--muted)">🔍</span>
      <input type="text" placeholder="Tafuta ujumbe au namba..." oninput="filterSmsIn(this.value)">
    </div>
    <div id="sms-in-list"><div class="loading"><div class="spinner"></div>Inapakia...</div></div>
  </div>

  <!-- SMS OUT -->
  <div id="sms-out-panel" class="panel">
    <button class="refresh-btn" onclick="loadSmsOut()">
      🔄 REFRESH
    </button>
    <div class="search-box">
      <span style="color:var(--muted)">🔍</span>
      <input type="text" placeholder="Tafuta ujumbe au namba..." oninput="filterSmsOut(this.value)">
    </div>
    <div id="sms-out-list"><div class="loading"><div class="spinner"></div>Inapakia...</div></div>
  </div>

  <!-- CONTACTS -->
  <div id="contacts-panel" class="panel">
    <button class="refresh-btn" onclick="loadContacts()">
      🔄 REFRESH
    </button>
    <div class="search-box">
      <span style="color:var(--muted)">🔍</span>
      <input type="text" placeholder="Tafuta jina au namba..." oninput="filterContacts(this.value)">
    </div>
    <div id="contacts-list"><div class="loading"><div class="spinner"></div>Inapakia...</div></div>
  </div>

</div>

<!-- Modal -->
<div class="modal-overlay" id="modal" onclick="closeModal()">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modal-title">Details</div>
    <div id="modal-body"></div>
    <button class="modal-close" onclick="closeModal()">Funga</button>
  </div>
</div>

<script>
// ============================================
// BADILISHA HAPA — Firebase config yako
// ============================================
const firebaseConfig = {
  apiKey: "AIzaSyASDDEPhF1oBHslrz4PTnRjAm1dt-cgzEM",
  authDomain: "simuyanyumbani-68798.firebaseapp.com",
  databaseURL: "https://simuyanyumbani-68798-default-rtdb.firebaseio.com",
  projectId: "simuyanyumbani-68798",
  storageBucket: "simuyanyumbani-68798.firebasestorage.app",
  messagingSenderId: "282724830076",
  appId: "1:282724830076:web:abee0179af2d0064f1f2f9"
};
// ============================================

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let allCalls = [], allSmsIn = [], allSmsOut = [], allContacts = [];

// Colors for avatars
function getColor(str) {
  const colors = ['#00d4ff','#ff6b35','#4ade80','#f59e0b','#a855f7','#ec4899','#06b6d4'];
  let hash = 0;
  for (let c of (str || 'X')) hash = c.charCodeAt(0) + ((hash << 5) - hash);
  return colors[Math.abs(hash) % colors.length];
}

function getInitial(name) {
  if (!name || name === 'Haijahifadhiwa' || name === 'Namba Iliyofichwa') return '?';
  return name.charAt(0).toUpperCase();
}

// Tab switching
function showTab(panelId, btn) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById(panelId).classList.add('active');
  btn.classList.add('active');
}

// Modal
function openModal(title, data) {
  document.getElementById('modal-title').textContent = title;
  const body = document.getElementById('modal-body');
  body.innerHTML = Object.entries(data).map(([k, v]) => `
    <div class="modal-row">
      <span class="modal-key">${k.toUpperCase()}</span>
      <span class="modal-val">${v || '—'}</span>
    </div>
  `).join('');
  document.getElementById('modal').classList.add('open');
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
}

// ---- CALLS ----
function loadCalls() {
  const list = document.getElementById('calls-list');
  list.innerHTML = '<div class="loading"><div class="spinner"></div>Inapakia...</div>';
  db.ref('calls').once('value', snap => {
    allCalls = [];
    snap.forEach(child => allCalls.push({id: child.key, ...child.val()}));
    allCalls.reverse();
    document.getElementById('count-calls').textContent = allCalls.length;
    document.getElementById('tab-calls').textContent = allCalls.length;
    renderCalls(allCalls);
  });
}

function renderCalls(data) {
  const list = document.getElementById('calls-list');
  if (!data.length) {
    list.innerHTML = '<div class="empty"><div class="empty-icon">📞</div><div class="empty-text">Hakuna simu bado</div></div>';
    return;
  }
  list.innerHTML = data.map(c => {
    const color = getColor(c.number);
    const initial = getInitial(c.jina !== 'Haijahifadhiwa' ? c.jina : c.number);
    const badgeClass = c.aina === 'IMEINGIA' ? 'in' : c.aina === 'IMEKOSEKANA' ? 'missed' : 'out';
    const badgeIcon = c.aina === 'IMEINGIA' ? '↙' : c.aina === 'IMEKOSEKANA' ? '✕' : '↗';
    return `<div class="item" onclick='openModal("📞 ${c.jina || c.number}", ${JSON.stringify({
      "Jina": c.jina || "—",
      "Namba": c.number || "—",
      "Aina": c.aina || "—",
      "Muda": c.muda || "—",
      "Wakati": c.time || "—"
    })})'>
      <div class="item-avatar" style="background:${color}22;color:${color}">${initial}</div>
      <div class="item-body">
        <div class="item-top">
          <div class="item-name">${c.jina && c.jina !== 'Haijahifadhiwa' ? c.jina : (c.number || 'Namba Iliyofichwa')}</div>
          <div class="item-time">${(c.time || '').split(' ')[1] || ''}</div>
        </div>
        <div class="item-number">${c.number || '—'}</div>
        <div>
          <span class="badge ${badgeClass}">${badgeIcon} ${c.aina || '—'}</span>
          ${c.muda ? `<span class="badge duration">⏱ ${c.muda}</span>` : ''}
        </div>
      </div>
    </div>`;
  }).join('');
}

function filterCalls(q) {
  const filtered = allCalls.filter(c => 
    (c.number||'').includes(q) || 
    (c.jina||'').toLowerCase().includes(q.toLowerCase()) ||
    (c.aina||'').toLowerCase().includes(q.toLowerCase())
  );
  renderCalls(filtered);
}

// ---- SMS IN ----
function loadSmsIn() {
  const list = document.getElementById('sms-in-list');
  list.innerHTML = '<div class="loading"><div class="spinner"></div>Inapakia...</div>';
  db.ref('sms_inbox').once('value', snap => {
    allSmsIn = [];
    snap.forEach(child => allSmsIn.push({id: child.key, ...child.val()}));
    allSmsIn.reverse();
    document.getElementById('count-sms-in').textContent = allSmsIn.length;
    document.getElementById('tab-sms-in').textContent = allSmsIn.length;
    renderSmsIn(allSmsIn);
  });
}

function renderSmsIn(data) {
  const list = document.getElementById('sms-in-list');
  if (!data.length) {
    list.innerHTML = '<div class="empty"><div class="empty-icon">📩</div><div class="empty-text">Hakuna SMS zilizoingia bado</div></div>';
    return;
  }
  list.innerHTML = data.map(s => {
    const color = getColor(s.from);
    const initial = getInitial(s.jina !== 'Haijahifadhiwa' ? s.jina : s.from);
    return `<div class="item" onclick='openModal("📩 SMS Iliyoingia", ${JSON.stringify({
      "Jina": s.jina || "—",
      "Kutoka": s.from || "—",
      "Ujumbe": s.message || "—",
      "Wakati": s.time || "—"
    })})'>
      <div class="item-avatar" style="background:${color}22;color:${color}">${initial}</div>
      <div class="item-body">
        <div class="item-top">
          <div class="item-name">${s.jina && s.jina !== 'Haijahifadhiwa' ? s.jina : (s.from || 'Namba Iliyofichwa')}</div>
          <div class="item-time">${(s.time || '').split(' ')[1] || ''}</div>
        </div>
        <div class="item-number">${s.from || '—'}</div>
        <div class="item-preview">${s.message || '—'}</div>
      </div>
    </div>`;
  }).join('');
}

function filterSmsIn(q) {
  const filtered = allSmsIn.filter(s => 
    (s.from||'').includes(q) || 
    (s.jina||'').toLowerCase().includes(q.toLowerCase()) ||
    (s.message||'').toLowerCase().includes(q.toLowerCase())
  );
  renderSmsIn(filtered);
}

// ---- SMS OUT ----
function loadSmsOut() {
  const list = document.getElementById('sms-out-list');
  list.innerHTML = '<div class="loading"><div class="spinner"></div>Inapakia...</div>';
  db.ref('sms_sent').once('value', snap => {
    allSmsOut = [];
    snap.forEach(child => allSmsOut.push({id: child.key, ...child.val()}));
    allSmsOut.reverse();
    document.getElementById('count-sms-out').textContent = allSmsOut.length;
    document.getElementById('tab-sms-out').textContent = allSmsOut.length;
    renderSmsOut(allSmsOut);
  });
}

function renderSmsOut(data) {
  const list = document.getElementById('sms-out-list');
  if (!data.length) {
    list.innerHTML = '<div class="empty"><div class="empty-icon">📤</div><div class="empty-text">Hakuna SMS zilizotumwa bado</div></div>';
    return;
  }
  list.innerHTML = data.map(s => {
    const color = getColor(s.to);
    const initial = getInitial(s.jina !== 'Haijahifadhiwa' ? s.jina : s.to);
    return `<div class="item" onclick='openModal("📤 SMS Iliyotumwa", ${JSON.stringify({
      "Jina": s.jina || "—",
      "Kwenda": s.to || "—",
      "Ujumbe": s.message || "—",
      "Wakati": s.time || "—"
    })})'>
      <div class="item-avatar" style="background:${color}22;color:${color}">${initial}</div>
      <div class="item-body">
        <div class="item-top">
          <div class="item-name">${s.jina && s.jina !== 'Haijahifadhiwa' ? s.jina : (s.to || 'Namba Iliyofichwa')}</div>
          <div class="item-time">${(s.time || '').split(' ')[1] || ''}</div>
        </div>
        <div class="item-number">${s.to || '—'}</div>
        <div class="item-preview">${s.message || '—'}</div>
      </div>
    </div>`;
  }).join('');
}

function filterSmsOut(q) {
  const filtered = allSmsOut.filter(s => 
    (s.to||'').includes(q) || 
    (s.jina||'').toLowerCase().includes(q.toLowerCase()) ||
    (s.message||'').toLowerCase().includes(q.toLowerCase())
  );
  renderSmsOut(filtered);
}

// ---- CONTACTS ----
function loadContacts() {
  const list = document.getElementById('contacts-list');
  list.innerHTML = '<div class="loading"><div class="spinner"></div>Inapakia...</div>';
  db.ref('contacts').once('value', snap => {
    allContacts = [];
    const data = snap.val();
    if (Array.isArray(data)) {
      allContacts = data.filter(c => c && c.jina);
    }
    document.getElementById('count-contacts').textContent = allContacts.length;
    document.getElementById('tab-contacts').textContent = allContacts.length;
    renderContacts(allContacts);
  });
}

function renderContacts(data) {
  const list = document.getElementById('contacts-list');
  if (!data.length) {
    list.innerHTML = '<div class="empty"><div class="empty-icon">👥</div><div class="empty-text">Hakuna contacts bado — subiri dakika moja baada ya app kufunguka</div></div>';
    return;
  }
  list.innerHTML = `<div class="contacts-grid">${data.map(c => {
    const color = getColor(c.jina);
    const initial = getInitial(c.jina);
    return `<div class="contact-card" onclick='openModal("👤 ${c.jina}", ${JSON.stringify({
      "Jina": c.jina || "—",
      "Namba": c.namba || "—"
    })})'>
      <div class="contact-avatar" style="background:${color}22;color:${color}">${initial}</div>
      <div class="contact-name">${c.jina}</div>
      <div class="contact-number">${c.namba || '—'}</div>
    </div>`;
  }).join('')}</div>`;
}

function filterContacts(q) {
  const filtered = allContacts.filter(c => 
    (c.jina||'').toLowerCase().includes(q.toLowerCase()) ||
    (c.namba||'').includes(q)
  );
  renderContacts(filtered);
}

// Load all data
loadCalls();
loadSmsIn();
loadSmsOut();
loadContacts();

// Auto-refresh kila dakika 1
setInterval(() => {
  loadCalls();
  loadSmsIn();
  loadSmsOut();
  loadContacts();
}, 60000);
</script>

<script>
// BADILISHA NYWILA HAPA
var PASSWORD = "petpol.1frank";

function checkPwd() {
